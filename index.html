<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولدتي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
body{background:#f0f2f5;color:#1a1a1a;min-height:100vh}
:root{--primary:#f59e0b;--primary-dark:#d97706;--success:#10b981;--danger:#ef4444;--gray:#6b7280;--border:#e5e7eb;--bg:#f0f2f5}
.hidden{display:none!important}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#f59e0b,#d97706)}
.login h1{color:#fff;font-size:32px;margin-bottom:8px}
.login p{color:#fff;opacity:.9;margin-bottom:40px}
.role-btn{width:100%;max-width:340px;padding:20px;margin:8px 0;background:#fff;border:none;border-radius:16px;font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .1s}
.role-btn:active{transform:scale(.98)}
.role-btn span{font-size:28px}
.app{max-width:500px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.header{background:var(--primary);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header h2{font-size:18px}
.header button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.content{flex:1;padding:16px;padding-bottom:90px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#fff;display:flex;border-top:1px solid var(--border);z-index:10}
.nav-btn{flex:1;padding:10px 4px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--gray);font-size:10px}
.nav-btn.active{color:var(--primary)}
.nav-btn .ico{font-size:20px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{font-size:15px;margin-bottom:12px;color:var(--gray);font-weight:500}
.stat{font-size:26px;font-weight:700;color:var(--primary-dark)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:8px}
.row:last-child{border:none}
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
.btn.success{background:var(--success)}
.btn.danger{background:var(--danger)}
.btn.ghost{background:#f3f4f6;color:var(--gray)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:12px}
.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
.label{display:block;font-size:13px;color:var(--gray);margin-bottom:6px}
.status-pill{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.on{background:#d1fae5;color:#065f46}
.off{background:#fee2e2;color:#991b1b}
.pending{background:#fef3c7;color:#92400e}
.toggle{width:100%;padding:20px;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:12px}
.toggle.on{background:var(--success);color:#fff}
.toggle.off{background:var(--danger);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box h3{margin-bottom:16px;font-size:18px}
.modal-close{background:var(--gray);color:#fff;border:none;padding:10px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer}
.qr-box{text-align:center;padding:20px;background:#f9fafb;border-radius:12px;margin-bottom:12px}
.qr-box .num{font-size:24px;font-weight:700;letter-spacing:1px;direction:ltr;margin:10px 0;color:#1a1a1a}
.empty{text-align:center;padding:40px 20px;color:var(--gray);font-size:14px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;z-index:999;font-size:20px;font-weight:bold;color:var(--primary)}
</style>
</head>
<body>

<div id="login" class="login">
  <h1>⚡ مولدتي</h1>
  <p>نظام إدارة المولدات الأهلية</p>
  <button class="role-btn" onclick="login('owner')"><span>⚡</span> أبو المولدة</button>
  <button class="role-btn" onclick="login('collector')"><span>💰</span> الجابي</button>
  <button class="role-btn" onclick="login('citizen')"><span>👤</span> المواطن</button>
  <button class="role-btn" onclick="login('admin')"><span>⚙️</span> مدير المنصة</button>
</div>

<div id="app" class="app hidden">
  <div class="header">
    <h2 id="headerTitle">الرئيسية</h2>
    <button onclick="logout()">خروج</button>
  </div>
  <div id="content" class="content"></div>
  <div id="nav" class="bottom-nav"></div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="loading" class="loading hidden">جاري التحميل...</div>

<script>
const supabaseUrl = 'https://mbukheyuiuiadjkchhrs.supabase.co';
const supabaseKey = 'sb_publishable_eElmjfXNtwo8sauLjU3yEw_Bc4h9MPQ';
let supabase = null;
try {
    supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
} catch(e) {
    console.error("Supabase init error:", e);
}

let DB = {
    generator: {name:'مولدة النور', pricePerAmp:5000, superQiNumber:'07701234567', phone:'07701234567', status:false, startTime:null},
    subscribers: [],
    payments: [],
    expenses: [],
    complaints: []
};
let session={role:null,currentPanel:null};

function showLoad(){document.getElementById('loading').classList.remove('hidden')}
function hideLoad(){document.getElementById('loading').classList.add('hidden')}
function fmt(n){return Number(n||0).toLocaleString('en-US')+' د.ع'}
function fmtDate(d){return new Date(d).toLocaleDateString('ar-IQ')}
function isToday(ts){const d=new Date(ts),t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate()}
function isSameMonth(ts){const d=new Date(ts),t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()}

async function syncData() {
    if(!supabase) return;
    showLoad();
    try {
        const [s, p, e, c] = await Promise.all([
            supabase.from('subscribers').select('*').order('created_at', { ascending: false }),
            supabase.from('payments').select('*'),
            supabase.from('expenses').select('*'),
            supabase.from('complaints').select('*')
        ]);
        if (s.error) throw s.error;
        DB.subscribers = s.data || [];
        DB.payments = p.data || [];
        DB.expenses = e.data || [];
        DB.complaints = c.data || [];
    } catch (err) {
        alert('⚠️ خطأ في قاعدة البيانات: ' + err.message);
    }
    hideLoad();
}

async function login(role){
  session.role=role;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const first={owner:'owner-home',collector:'collector-today',citizen:'citizen-gen',admin:'admin-gens'};
  go(first[role]);
  await syncData();
  go(session.currentPanel); 
}

function logout(){
  session={role:null,currentPanel:null};
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

const NAVS={
  owner:[{id:'owner-home',icon:'🏠',label:'الرئيسية'},{id:'owner-subs',icon:'👥',label:'المشتركين'},{id:'owner-collect',icon:'💵',label:'التحصيل'}],
  collector:[{id:'collector-today',icon:'🚶',label:'جولة اليوم'}],
  citizen:[{id:'citizen-gen',icon:'⚡',label:'المولدة'},{id:'citizen-invoice',icon:'🧾',label:'فاتورتي'}],
  admin:[{id:'admin-gens',icon:'🏭',label:'المولدات'}]
};

function go(panelId){
  session.currentPanel=panelId;
  renderNav();
  const render=RENDERERS[panelId];
  if(render){
    document.getElementById('content').innerHTML=render();
    const title=(NAVS[session.role].find(n=>n.id===panelId)||{}).label||'';
    document.getElementById('headerTitle').textContent=title;
  }
}
function renderNav(){
  const navs=NAVS[session.role]||[];
  document.getElementById('nav').innerHTML=navs.map(n=>`<button class="nav-btn ${session.currentPanel===n.id?'active':''}" onclick="go('${n.id}')"><span class="ico">${n.icon}</span><span>${n.label}</span></button>`).join('');
}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

function calcMonthly(sub){return sub.amps*DB.generator.pricePerAmp}
function isSubPaidThisMonth(subId){return DB.payments.some(p=>p.sub_id===subId&&isSameMonth(p.date)&&p.status==='paid')}
function isSubPendingThisMonth(subId){return DB.payments.some(p=>p.sub_id===subId&&isSameMonth(p.date)&&p.status==='pending')}
function getUnpaidSubs(){return DB.subscribers.filter(s=>!isSubPaidThisMonth(s.id))}
function totalCollectedToday(){return DB.payments.filter(p=>isToday(p.date)&&p.status==='paid').reduce((s,p)=>s+Number(p.amount),0)}
function totalCollectedMonth(){return DB.payments.filter(p=>isSameMonth(p.date)&&p.status==='paid').reduce((s,p)=>s+Number(p.amount),0)}

const RENDERERS={};

RENDERERS['owner-home']=()=>{
  const g=DB.generator;
  const unpaid=getUnpaidSubs();
  const totalSubs=DB.subscribers.length;
  const paidCount=totalSubs-unpaid.length;
  return `
    <div class="card">
      <button class="toggle ${g.status?'on':'off'}" onclick="toggleGenerator()">${g.status?'⚡ المولدة شغالة':'🔴 المولدة مطفية'}</button>
    </div>
    <div class="card"><h3>💰 اليوم</h3><div class="stat">${fmt(totalCollectedToday())}</div></div>
    <div class="card"><h3>👥 المشتركين</h3>
      <div class="row"><span>المسددين</span><b style="color:var(--success)">${paidCount}</b></div>
      <div class="row"><span>المتأخرين</span><b style="color:var(--danger)">${unpaid.length}</b></div>
      <div class="row"><span>المجموع</span><b>${totalSubs}</b></div>
    </div>
  `;
};
function toggleGenerator(){ DB.generator.status = !DB.generator.status; go('owner-home'); }

RENDERERS['owner-subs']=()=>`
  <button class="btn block" style="margin-bottom:12px" onclick="addSubForm()">+ إضافة مشترك</button>
  <div id="subsList">${renderSubsList(DB.subscribers)}</div>
`;
function renderSubsList(subs){
  if(subs.length===0)return `<div class="empty">لا يوجد مشتركون</div>`;
  return subs.map(s=>{
    const paid=isSubPaidThisMonth(s.id),pending=isSubPendingThisMonth(s.id);
    const status=paid?'<span class="status-pill on">✅ مسدد</span>':pending?'<span class="status-pill pending">⏳ بانتظار</span>':'<span class="status-pill off">❌ متأخر</span>';
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
        <div><b style="font-size:16px">${s.name}</b><div style="color:var(--gray);font-size:13px;margin-top:2px">${s.amps} أمبير</div></div>
        ${status}
      </div>
      <div class="row"><span>المبلغ الشهري</span><b>${fmt(calcMonthly(s))}</b></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn sm danger" onclick="deleteSub('${s.id}')">حذف</button>
        <button class="btn sm success" onclick="markPaid('${s.id}','cash')">استلمت كاش</button>
      </div>
    </div>`;
  }).join('');
}
function addSubForm(){
  openModal(`<h3>➕ إضافة مشترك</h3>
    <label class="label">الاسم</label><input class="input" id="subName" placeholder="اسم المشترك">
    <label class="label">عدد الأمبير</label><input class="input" id="subAmps" type="number" value="5">
    <button class="btn block" onclick="saveSub()">حفظ</button>
    <button class="modal-close" onclick="closeModal()">إلغاء</button>`);
}
async function saveSub(){
  const name=document.getElementById('subName').value.trim();
  const amps=Number(document.getElementById('subAmps').value);
  if(!name||!amps){alert('أدخل الاسم والأمبير');return}
  showLoad(); closeModal();
  await supabase.from('subscribers').insert([{name, amps, phone:'-'}]);
  await syncData(); go('owner-subs'); alert('✅ تم الحفظ في السحابة');
}
async function deleteSub(id){
  if(!confirm('تأكيد الحذف؟'))return;
  showLoad(); await supabase.from('subscribers').delete().eq('id', id);
  await syncData(); go('owner-subs');
}
async function markPaid(subId,method){
  const sub=DB.subscribers.find(s=>s.id===subId);if(!sub)return;
  showLoad();
  await supabase.from('payments').insert([{sub_id: subId, amount: calcMonthly(sub), method, status: 'paid'}]);
  await syncData(); go(session.currentPanel); alert('✅ تم تسجيل الدفع');
}

RENDERERS['owner-collect']=()=>{
  const unpaid=getUnpaidSubs().filter(s=>!isSubPendingThisMonth(s.id));
  return `
    <div class="card"><h3>❌ لم يدفعوا (${unpaid.length})</h3>
      ${unpaid.length===0?'<div style="color:var(--gray);font-size:13px">كلهم دفعوا 🎉</div>':unpaid.map(s=>`<div class="row"><span>${s.name}</span><span>${fmt(calcMonthly(s))}</span><button class="btn sm success" onclick="markPaid('${s.id}','cash')">استلمت</button></div>`).join('')}
    </div>
  `;
};

RENDERERS['collector-today']=()=>{
  const unpaid=DB.subscribers.filter(s=>!isSubPaidThisMonth(s.id)&&!isSubPendingThisMonth(s.id));
  return `<div class="card"><h3>🚶 جولة اليوم</h3><div style="color:var(--gray);font-size:13px">${unpaid.length} مشترك لم يدفعوا</div></div>
    ${unpaid.length===0?'<div class="empty">كل المشتركين دفعوا 🎉</div>':unpaid.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${s.name}</b></div><div style="text-align:left"><div style="font-weight:700;color:var(--primary-dark)">${fmt(calcMonthly(s))}</div><button class="btn sm success" style="margin-top:6px" onclick="markPaid('${s.id}','cash')">استلمت</button></div></div></div>`).join('')}`;
};

RENDERERS['citizen-gen']=()=>{
  return `<div class="card" style="text-align:center;padding:30px 20px">
    <div style="font-size:60px;margin-bottom:10px">${DB.generator.status?'⚡':'🔴'}</div>
    <div style="font-size:22px;font-weight:700;color:${DB.generator.status?'var(--success)':'var(--danger)'}">${DB.generator.status?'المولدة شغالة':'المولدة مطفية'}</div>
    </div>`;
};

RENDERERS['citizen-invoice']=()=>{
  const sub=DB.subscribers[0]; 
  if(!sub)return '<div class="empty">لا يوجد حساب مشترك مسجل</div>';
  const amount=calcMonthly(sub);
  const paid=isSubPaidThisMonth(sub.id);
  return `<div class="card"><h3>فاتورة الشهر</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0">
      <div><div style="font-size:13px;color:var(--gray)">المبلغ المطلوب</div><div class="stat">${fmt(amount)}</div></div>
      ${paid?'<span class="status-pill on">✅ مسدد</span>':'<span class="status-pill off">❌ غير مسدد</span>'}
    </div>
    </div>
    ${!paid?`<button class="btn block" onclick="payOnline('${sub.id}')">💳 ادفع الآن (سوبر كيو)</button>`:''}`;
};
function payOnline(subId){
  openModal(`<h3>💳 الدفع عبر سوبر كيو</h3>
    <div class="qr-box"><div>حوّل إلى: ${DB.generator.superQiNumber}</div></div>
    <button class="btn block success" onclick="markPending('${subId}')">✅ حوّلت المبلغ</button>
    <button class="modal-close" onclick="closeModal()">إلغاء</button>`);
}
async function markPending(subId){
  const sub=DB.subscribers.find(s=>s.id===subId);
  showLoad(); closeModal();
  await supabase.from('payments').insert([{sub_id: subId, amount: calcMonthly(sub), method: 'transfer', status: 'pending'}]);
  await syncData(); go('citizen-invoice'); alert('⏳ بانتظار تأكيد الجابي');
}

RENDERERS['admin-gens']=()=>`
  <div class="card"><h3>🏭 المولدات المسجلة</h3><div class="row"><span>${DB.generator.name}</span><b style="color:var(--success)">نشط</b></div></div>
  <div class="card"><h3>📊 إحصائيات</h3>
    <div class="row"><span>المشتركين</span><b>${DB.subscribers.length}</b></div>
  </div>`;
</script>
</body>
</html>
