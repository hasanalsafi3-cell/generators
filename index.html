<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولدتي</title>
    <!-- صائد الأخطاء: سيظهر لك تنبيه إذا كان الكود فيه خطأ إملائي -->
    <script>
        window.onerror = function(msg, url, line) {
            alert('⚠️ خطأ برمجي:\n' + msg + '\nالسطر: ' + line);
            return false;
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        .screen { padding: 20px; text-align: center; }
        .btn { padding: 15px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; max-width: 300px; margin: 10px auto; display: block; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: right; }
        .input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .header { background: #f59e0b; color: white; padding: 15px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="loginScreen" class="screen">
        <h1>⚡ مولدتي</h1>
        <button class="btn" onclick="login('owner')">أبو المولدة</button>
        <button class="btn" onclick="login('citizen')">المواطن</button>
    </div>

    <div id="appScreen" class="hidden">
        <div class="header">
            <h3 id="headerTitle" style="margin: 0;">الرئيسية</h3>
            <button onclick="logout()" style="background:transparent; border:1px solid white; color:white; border-radius:5px; padding: 5px;">خروج</button>
        </div>
        <div class="screen" id="content"></div>
    </div>

    <div id="modal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); padding: 20px; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;" id="modalContent"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
