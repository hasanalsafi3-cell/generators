<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولدتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding-bottom: 70px; }
        .hidden { display: none !important; }
        .screen { padding: 20px; }
        .btn { padding: 15px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; max-width: 300px; margin: 10px auto; display: block; font-weight: bold; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: right; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .header { background: #f59e0b; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        
        /* تنسيقات القائمة السفلية */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #ddd; z-index: 10; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; color: #6b7280; font-size: 12px; font-weight: bold; cursor: pointer; border: none; background: none; }
        .nav-item.active { color: #f59e0b; }
        .nav-item span { display: block; font-size: 20px; margin-bottom: 3px; }
        
        /* نافذة منبثقة */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .status-pill { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .on { background: #d1fae5; color: #065f46; }
        .off { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <!-- شاشة الدخول -->
    <div id="loginScreen" class="screen" style="text-align:center;">
        <h1 style="color:#f59e0b; margin-bottom: 30px;">⚡ مولدتي</h1>
        <button class="btn" onclick="login('owner')">⚡ أبو المولدة</button>
        <button class="btn" onclick="login('citizen')">👤 المواطن</button>
    </div>

    <!-- شاشة التطبيق -->
    <div id="appScreen" class="hidden">
        <div class="header">
            <h3 id="headerTitle" style="margin: 0;">الرئيسية</h3>
            <button onclick="logout()" style="background:transparent; border:1px solid white; color:white; border-radius:5px; padding: 5px;">خروج</button>
        </div>
        
        <div class="screen" id="content"></div>

        <!-- القائمة السفلية -->
        <div id="bottomNav" class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>الرئيسية</button>
            <button class="nav-item" onclick="switchTab('subs', this)"><span>👥</span>المشتركين</button>
            <button class="nav-item" onclick="switchTab('collect', this)"><span>💵</span>التحصيل</button>
        </div>
    </div>

    <!-- النافذة المنبثقة (لإضافة مشترك أو الدفع) -->
    <div id="modal" class="modal hidden">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;" id="modalContent"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
