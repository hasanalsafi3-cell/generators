<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الزر</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
    
    <div id="loginScreen">
        <h1>شاشة الدخول</h1>
        <button onclick="goToApp()" style="padding: 15px 30px; font-size: 20px; background-color: orange; color: white; border: none; border-radius: 10px; cursor: pointer;">
            ⚡ أبو المولدة
        </button>
    </div>

    <div id="appScreen" style="display: none;">
        <h1 style="color: green;">✅ نجح الدخول!</h1>
        <p>هذا يعني أن الأزرار تشتغل 100%.</p>
    </div>

    <script>
        function goToApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
        }
    </script>

</body>
</html>
