<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولدتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .hidden { display: none; }
        .btn { padding: 15px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold;}
        .card { background: white; padding: 15px; border-radius: 10px; text-align: right;}
    </style>
</head>
<body>
    <div id="loginScreen">
        <h1 style="color: #f59e0b;">⚡ مولدتي</h1>
        <button class="btn" onclick="login('owner')">أبو المولدة</button>
    </div>
    
    <div id="appScreen" class="hidden">
        <button class="btn" style="background: red;" onclick="logout()">خروج</button>
        <div id="content" class="card"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
