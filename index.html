<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الاتصال</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; text-align: center;">
    <h2>اختبار قاعدة البيانات</h2>
    <div id="result" style="font-size: 18px; margin-top: 20px; font-weight: bold;">جاري الاتصال...</div>

    <script>
        // نضع الكود في try/catch لأمسك أي خطأ
        try {
            const supabase = window.supabase.createClient('https://mbukheyuiuiadjkchhrs.supabase.co', 'sb_publishable_eElmjfXNtwo8sauLjU3yEw_Bc4h9MPQ');
            
            // دالة تجيب البيانات من الجدول
            async function testDB() {
                const { data, error } = await supabase.from('subscribers').select('*');
                const resDiv = document.getElementById('result');
                
                if (error) {
                    resDiv.innerHTML = '❌ فشل الاتصال: <br>' + error.message;
                    resDiv.style.color = 'red';
                } else {
                    resDiv.innerHTML = '✅ نجح الاتصال! <br> عدد المشتركين: ' + data.length;
                    resDiv.style.color = 'green';
                }
            }
            
            testDB();
        } catch (e) {
            document.getElementById('result').innerHTML = '❌ خطأ برمجي: ' + e.message;
            document.getElementById('result').style.color = 'red';
        }
    </script>
</body>
</html>
