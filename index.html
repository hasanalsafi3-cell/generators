<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولدتي - الرئيسية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 0; padding-bottom: 70px; }
        .hidden { display: none !important; }
        .header { background: #f59e0b; color: white; padding: 20px 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h3 { margin: 0; font-size: 20px; }
        .header button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight:bold; }
        .content { padding: 15px; max-width: 500px; margin: 0 auto; }
        
        /* شاشة الدخول */
        .login-screen { text-align: center; padding-top: 100px; }
        .login-screen h1 { color: #f59e0b; font-size: 36px; margin-bottom: 30px; }
        .btn-login { padding: 15px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 80%; max-width: 300px; margin: 0 auto; display: block; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* القائمة السفلية */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #ddd; z-index: 10; }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; color: #9ca3af; font-size: 12px; font-weight: bold; border: none; background: none; }
        .nav-item.active { color: #f59e0b; }
        .nav-item span { display: block; font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <h1>⚡ مولدتي</h1>
        <button class="btn-login" onclick="login()">دخول أبو المولدة</button>
    </div>

    <div id="appScreen" class="hidden">
        <div class="header">
            <h3>الرئيسية</h3>
            <button onclick="logout()">خروج</button>
        </div>
        
        <div class="content" id="content">
            <h3 style="text-align:center; color:#6b7280;">جاري التحميل...</h3>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active"><span>🏠</span>الرئيسية</button>
            <button class="nav-item"><span>👥</span>المشتركين</button>
            <button class="nav-item"><span>💵</span>التحصيل</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
