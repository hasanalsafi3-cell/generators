<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة صاحب المولد</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; padding-bottom: 70px; }
        
        .header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f59e0b; }
        .header h1 { font-size: 20px; color: #f59e0b; }
        .header button { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .content { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        .card .value { font-size: 28px; font-weight: bold; color: #f59e0b; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: #f59e0b; }
        .nav-btn span { font-size: 22px; }

        .hidden { display: none !important; }
        
        /* تنسيقات داخلية */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; }
        .btn-primary { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        
        .list-item { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .status-green { background: #10b981; }
        .status-red { background: #ef4444; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <h1>⚡ صاحب المولد</h1>
        <button onclick="logout()">خروج</button>
    </div>

    <!-- منطقة المحتوى (تتغير حسب الزر) -->
    <div class="content" id="mainContent"></div>

    <!-- الشريط السفلي -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-home" onclick="switchTab('home')"><span>🏠</span>الرئيسية</button>
        <button class="nav-btn" id="nav-subs" onclick="switchTab('subs')"><span>👥</span>المشتركين</button>
        <button class="nav-btn" id="nav-collect" onclick="switchTab('collect')"><span>💵</span>التحصيل</button>
        <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')"><span>⚙️</span>الإعدادات</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
