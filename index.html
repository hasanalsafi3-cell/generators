<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولدتي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
  .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
  button { padding: 10px; background: #f59e0b; color: white; border: none; border-radius: 5px; width: 100%; margin-top: 10px; cursor: pointer; font-weight:bold;}
  input { padding: 10px; width: 90%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="loginScreen" class="box">
    <h1>⚡ مولدتي</h1>
    <p>الإصدار النظيف</p>
    <button onclick="login()">دخول أبو المولدة</button>
  </div>
  <div id="appScreen" class="box hidden">
    <h2>لوحة أبو المولدة</h2>
    <button onclick="toggleStatus()" id="statusBtn">🔴 المولدة مطفية</button>
    <hr>
    <h3>إضافة مشترك</h3>
    <input type="text" id="name" placeholder="اسم المشترك">
    <input type="number" id="amps" placeholder="عدد الأمبير" value="5">
    <button onclick="addSub()">حفظ في السحابة</button>
    <hr>
    <h3>المشتركين</h3>
    <div id="subsList">جاري التحميل...</div>
  </div>
  <script>
    const supabase = window.supabase.createClient('https://mbukheyuiuiadjkchhrs.supabase.co', 'sb_publishable_eElmjfXNtwo8sauLjU3yEw_Bc4h9MPQ');
    let isOn = false;

    function login() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      loadSubs();
    }

    function toggleStatus() {
      isOn = !isOn;
      document.getElementById('statusBtn').innerText = isOn ? '⚡ المولدة شغالة' : '🔴 المولدة مطفية';
      document.getElementById('statusBtn').style.background = isOn ? '#10b981' : '#ef4444';
    }

    async function addSub() {
      const name = document.getElementById('name').value;
      const amps = document.getElementById('amps').value;
      if(!name || !amps) return alert('املأ البيانات');
      const { error } = await supabase.from('subscribers').insert([{name: name, amps: amps, phone: '-'}]);
      if(error) return alert('خطأ: ' + error.message);
      document.getElementById('name').value = '';
      loadSubs();
      alert('✅ تم الحفظ!');
    }

    async function loadSubs() {
      const { data, error } = await supabase.from('subscribers').select('*');
      if (error) {
        document.getElementById('subsList').innerText = 'خطأ: ' + error.message;
        return;
      }
      document.getElementById('subsList').innerHTML = data.length === 0 ? 'لا يوجد مشتركين' : data.map(s => `<div style="padding:5px; border-bottom:1px solid #eee;">${s.name} - ${s.amps} أمبير</div>`).join('');
    }
  </script>
</body>
</html>
