<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة المولدات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at top right, #1e293b, #0b1120); padding-bottom: 50px;}
        .hidden { display: none !important; }

        /* شاشة الدخول */
        .auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 80vh; }
        .auth-box { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid #f59e0b; text-align: center;}
        .auth-box h2 { color: #f59e0b; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; margin-bottom: 15px; }
        .auth-btn { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .auth-switch { color: #94a3b8; font-size: 14px; margin-top: 10px; cursor: pointer; text-decoration: underline; }

        /* التطبيق */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(30, 41, 59, 0.8); border-radius: 15px; margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .top-bar h1 { font-size: 24px; color: #f8fafc; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .back-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }

        .dashboard-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; }
        .panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.4); }
        .panel.owner { border-top: 4px solid #f59e0b; }
        .panel.admin { border-top: 4px solid #eab308; }
        .panel.citizen { border-top: 4px solid #3b82f6; }
        .panel-header h2 { font-size: 22px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .panel.owner .panel-header h2 { color: #f59e0b; }
        .panel.admin .panel-header h2 { color: #eab308; }
        .panel.citizen .panel-header h2 { color: #3b82f6; }

        .card-item { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s; }
        .card-item:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        .card-text { text-align: right; width: 100%; }
        .card-text h4 { font-size: 15px; margin-bottom: 4px; color: #e2e8f0; }
        .card-text p { font-size: 12px; color: #94a3b8; }
        .card-icon { font-size: 24px; margin-right: 15px; }

        .inner-screen { background: rgba(30, 41, 59, 0.95); border-radius: 20px; padding: 20px; max-width: 600px; margin: 0 auto; border-top: 4px solid #f59e0b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .inner-screen h2 { color: #f59e0b; margin-bottom: 20px; font-size: 22px;}
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; }
        .btn-save { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px;}
        .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .btn-warning { background: #f59e0b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        
        .list-item { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .stat-box { background:#1e293b; padding:15px; border-radius:10px; text-align:center; margin-bottom:10px;}
        .stat-box h4 { color:#94a3b8; font-size:14px; margin-bottom:5px;}
        .stat-box p { color:#f8fafc; font-size:20px; font-weight:bold;}

        @media (max-width: 768px) { .dashboard-grid { flex-direction: column; align-items: center; } }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="authScreen" class="auth-screen hidden">
        <div class="auth-box">
            <h2 id="authTitle">تسجيل الدخول</h2>
            <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="authPassword" placeholder="كلمة المرور">
            <button class="auth-btn" id="authBtn" onclick="handleAuth()">دخول</button>
            <div class="auth-switch" onclick="toggleAuthMode()" id="authSwitch">ليس لديك حساب؟ إنشاء حساب جديد</div>
        </div>
    </div>

    <!-- 2. التطبيق (مخفي في البداية) -->
    <div id="appScreen" class="hidden">
        <div class="top-bar">
            <h1 id="mainTitle">🔌 منصة إدارة المولدات</h1>
            <div>
                <button id="backBtn" class="back-btn hidden" onclick="goBack()">↩ رجوع</button>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
        </div>

        <div id="dashboard-view" class="dashboard-grid">
            <!-- صاحب المولد -->
            <div class="panel owner">
                <div class="panel-header"><h2>صاحب المولد ⚡</h2></div>
                <div class="card-item" onclick="openScreen('owner-home')"><div class="card-text"><h4>1. الرئيسية</h4></div><div class="card-icon">📊</div></div>
                <div class="card-item" onclick="openScreen('owner-subs')"><div class="card-text"><h4>2. إدارة المشتركين</h4></div><div class="card-icon">👥</div></div>
                <div class="card-item" onclick="openScreen('owner-invoices')"><div class="card-text"><h4>3. الفواتير والتحصيل</h4></div><div class="card-icon">💵</div></div>
                <div class="card-item" onclick="openScreen('owner-generator')"><div class="card-text"><h4>4. إدارة المولد</h4></div><div class="card-icon">⚙️</div></div>
                <div class="card-item" onclick="openScreen('owner-fuel')"><div class="card-text"><h4>5. الوقود</h4></div><div class="card-icon">⛽</div></div>
                <div class="card-item" onclick="openScreen('owner-reports')"><div class="card-text"><h4>6. التقارير</h4></div><div class="card-icon">📈</div></div>
                <div class="card-item" onclick="openScreen('owner-messages')"><div class="card-text"><h4>7. الرسائل</h4></div><div class="card-icon">💬</div></div>
                <div class="card-item" onclick="openScreen('owner-settings')"><div class="card-text"><h4>8. الإعدادات</h4></div><div class="card-icon">⚙️</div></div>
            </div>
            <!-- مالك المنصة -->
            <div class="panel admin">
                <div class="panel-header"><h2>مالك المنصة 👑</h2></div>
                <div class="card-item" onclick="openScreen('admin-home')"><div class="card-text"><h4>لوحة التحكم</h4></div><div class="card-icon">📈</div></div>
            </div>
            <!-- المواطن -->
            <div class="panel citizen">
                <div class="panel-header"><h2>المواطن 👤</h2></div>
                <div class="card-item" onclick="openScreen('citizen-invoice')"><div class="card-text"><h4>الفواتير</h4></div><div class="card-icon">🧾</div></div>
            </div>
        </div>

        <div id="inner-view" class="hidden"></div>
    </div>

    <script>
        var supabase = window.supabase.createClient('https://mbukheyuiuiadjkchhrs.supabase.co', 'sb_publishable_eElmjfXNtwo8sauLjU3yEw_Bc4h9MPQ');
        var DB = { subs: [], payments: [], expenses: [], settings: { price_per_amp: 5000, status: true } };
        var currentUser = null;
        var isLoginMode = true;

        // 1. التحقق من حالة الدخول عند فتح الصفحة
        async function checkAuth() {
            var { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
            }
        }

        // 2. تسجيل الدخول / إنشاء حساب
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
            document.getElementById('authBtn').innerText = isLoginMode ? 'دخول' : 'إنشاء الحساب';
            document.getElementById('authSwitch').innerText = isLoginMode ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول';
        }

        async function handleAuth() {
            var email = document.getElementById('authEmail').value;
            var password = document.getElementById('authPassword').value;
            if(!email || !password) return alert('أدخل الإيميل والباسورد');

            if (isLoginMode) {
                var { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
                if (error) alert('خطأ: ' + error.message);
                else { currentUser = data.user; showApp(); }
            } else {
                var { data, error } = await supabase.auth.signUp({ email: email, password: password });
                if (error) alert('خطأ: ' + error.message);
                else {
                    alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                    toggleAuthMode();
                }
            }
        }

        // 3. تسجيل الخروج
        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // 4. إظهار التطبيق
        async function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            await loadData();
        }

        // 5. جلب البيانات (مفلترة حسب المستخدم الحالي)
        async function loadData() {
            if(!currentUser) return;
            
            var resSubs = await supabase.from('subscribers').select('*').eq('user_id', currentUser.id);
            var resPays = await supabase.from('payments').select('*').eq('user_id', currentUser.id);
            var resExp = await supabase.from('expenses').select('*').eq('user_id', currentUser.id);
            var resSet = await supabase.from('settings').select('*').eq('user_id', currentUser.id).single();
            
            if (resSubs.data) DB.subs = resSubs.data;
            if (resPays.data) DB.payments = resPays.data;
            if (resExp.data) DB.expenses = resExp.data;
            
            // إذا كان أول مرة يدخل، ماكو إعدادات، ننشئ له إعدادات افتراضية
            if (resSet.data) {
                DB.settings = resSet.data;
            } else {
                var newSettings = { id: Math.floor(Math.random() * 100000), price_per_amp: 5000, status: true, generator_name: 'مولد النور', user_id: currentUser.id };
                await supabase.from('settings').insert([newSettings]);
                DB.settings = newSettings;
            }
        }

        // 6. التنقل بين الشاشات
        function openScreen(screenName) {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('mainTitle').innerText = 'العودة للرئيسية';
            
            var innerView = document.getElementById('inner-view');
            innerView.classList.remove('hidden');
            innerView.innerHTML = '<div class="inner-screen"><p style="text-align:center;">جاري التحميل...</p></div>';

            if (screenName === 'owner-home') renderOwnerHome();
            else if (screenName === 'owner-subs') renderSubsScreen();
            else if (screenName === 'owner-invoices') renderInvoicesScreen();
            else if (screenName === 'owner-settings') renderSettingsScreen();
            else if (screenName === 'admin-home') renderAdminHome();
            else if (screenName === 'citizen-invoice') renderCitizenInvoice();
        }

        function goBack() {
            document.getElementById('inner-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('mainTitle').innerText = '🔌 منصة إدارة المولدات';
            loadData(); 
        }

        // --- دوال الواجهات ---
        async function renderOwnerHome() {
            var total = 0;
            for(var i=0; i<DB.payments.length; i++){ total += Number(DB.payments[i].amount); }
            var genStatusColor = DB.settings.status ? '#10b981' : '#ef4444';
            var html = '<div class="inner-screen"><h2>📊 لوحة التحكم</h2>';
            html += '<div class="stat-box"><h4>حالة المولد</h4><p style="color:' + genStatusColor + ';">' + (DB.settings.status ? 'يعمل ⚡' : 'مطفي 🔴') + '</p><button class="btn-save" onclick="toggleGenerator()">تغيير الحالة</button></div>';
            html += '<div class="stat-box"><h4>المشتركين</h4><p>' + DB.subs.length + '</p></div>';
            html += '<div class="stat-box"><h4>الإيرادات</h4><p style="color:#10b981;">' + total.toLocaleString() + ' د.ع</p></div></div>';
            document.getElementById('inner-view').innerHTML = html;
        }

        async function toggleGenerator() {
            var newStatus = !DB.settings.status;
            await supabase.from('settings').update({ status: newStatus }).eq('id', DB.settings.id);
            DB.settings.status = newStatus;
            renderOwnerHome();
        }

        async function renderSubsScreen() {
            var html = '<div class="inner-screen"><h2>👥 المشتركين</h2>';
            html += '<div class="input-group"><input type="text" id="inpName" class="input-field" placeholder="الاسم"></div>';
            html += '<div class="input-group"><input type="number" id="inpAmps" class="input-field" value="5"></div>';
            html += '<button class="btn-save" onclick="addNewSub()">➕ إضافة</button>';
            for (var i = 0; i < DB.subs.length; i++) {
                var s = DB.subs[i];
                html += '<div class="list-item"><div><b>' + s.name + '</b> (' + s.amps + ' أمبير)</div><button class="btn-danger" onclick="deleteSub(&quot;' + s.id + '&quot;)">حذف</button></div>';
            }
            html += '</div>';
            document.getElementById('inner-view').innerHTML = html;
        }

        async function addNewSub() {
            var name = document.getElementById('inpName').value;
            var amps = document.getElementById('inpAmps').value;
            if (!name || !amps) return alert('أدخل البيانات');
            await supabase.from('subscribers').insert([{ name: name, amps: amps, phone: '-', user_id: currentUser.id }]);
            await loadData();
            renderSubsScreen(); 
        }

        async function deleteSub(id) {
            if (!confirm('تأكيد الحذف؟')) return;
            await supabase.from('subscribers').delete().eq('id', id);
            await loadData();
            renderSubsScreen();
        }

        async function renderInvoicesScreen() {
            var price = DB.settings.price_per_amp;
            var html = '<div class="inner-screen"><h2>💵 الفواتير</h2>';
            html += '<p style="text-align:center; color:#94a3b8;">سعر الأمبير: ' + price + '</p>';
            for (var i = 0; i < DB.subs.length; i++) {
                var s = DB.subs[i];
                var totalDue = s.amps * price;
                var totalPaid = 0;
                for (var j = 0; j < DB.payments.length; j++) {
                    if (DB.payments[j].sub_id === s.id) totalPaid += Number(DB.payments[j].amount);
                }
                var remaining = totalDue - totalPaid;
                html += '<div class="list-item"><div><b>' + s.name + '</b><br>متبقي: ' + remaining.toLocaleString() + '</div>';
                if (remaining > 0) html += '<button class="btn-save" style="width:auto;" onclick="paySub(&quot;' + s.id + '&quot;, ' + remaining + ')">استلم</button>';
                else html += '<span style="color:#10b981;">مكتمل</span>';
                html += '</div>';
            }
            html += '</div>';
            document.getElementById('inner-view').innerHTML = html;
        }

        async function paySub(subId, amount) {
            await supabase.from('payments').insert([{ sub_id: subId, amount: amount, method: 'cash', status: 'paid', user_id: currentUser.id }]);
            await loadData();
            renderInvoicesScreen();
        }

        async function renderSettingsScreen() {
            var html = '<div class="inner-screen"><h2>⚙️ الإعدادات</h2>';
            html += '<div class="input-group"><label>سعر الأمبير:</label><input type="number" id="inpPrice" class="input-field" value="' + DB.settings.price_per_amp + '"></div>';
            html += '<button class="btn-save" onclick="saveSettings()">حفظ</button></div>';
            document.getElementById('inner-view').innerHTML = html;
        }

        async function saveSettings() {
            var newPrice = document.getElementById('inpPrice').value;
            await supabase.from('settings').update({ price_per_amp: newPrice }).eq('id', DB.settings.id);
            DB.settings.price_per_amp = newPrice;
            alert('تم الحفظ');
        }

        async function renderAdminHome() {
            var html = '<div class="inner-screen"><h2>👑 المنصة</h2><p>هذه اللوحة لك أنت فقط.</p></div>';
            document.getElementById('inner-view').innerHTML = html;
        }

        async function renderCitizenInvoice() {
            var html = '<div class="inner-screen"><h2>🧾 واجهة المواطن</h2>';
            html += '<p style="text-align:center; color:' + (DB.settings.status ? '#10b981' : '#ef4444') + ';">' + (DB.settings.status ? 'المولدة شغالة ⚡' : 'المولدة مطفية 🔴') + '</p></div>';
            document.getElementById('inner-view').innerHTML = html;
        }

        // تشغيل التطبيق
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
